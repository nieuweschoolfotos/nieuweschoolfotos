<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Foto</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  background: #090d18;
  color: white;
  font-family: Arial, sans-serif;
}
.photo-card {
  background: #151d30;
  border: 1px solid #29344b;
  border-radius: 16px;
  overflow: hidden;
  transition: .25s;
}
.photo-card:hover {
  transform: translateY(-5px);
  border-color: #818cf8;
}
.photo-thumb {
  aspect-ratio: 4/3;
  overflow: hidden;
}
.photo-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.tab-active {
  background: #6366f1;
  color: white;
}
#lightbox {
  background: rgba(0,0,0,.96);
}
</style>
</head>

<body class="min-h-screen">

<header class="border-b border-white/10 p-6">
  <h1 class="text-3xl font-bold">▣ School Foto</h1>
  <p class="text-gray-400">Een plek voor mooie herinneringen</p>
</header>

<main class="max-w-7xl mx-auto p-6">

  <h2 class="text-3xl font-bold mb-3">
    Bekijk de foto's
  </h2>

  <p class="text-gray-400 mb-6">
    Kies een map en bekijk de foto's.
  </p>

  <input
    id="searchInput"
    type="search"
    placeholder="Zoek op ID of fotonaam..."
    class="w-full p-4 mb-6 rounded-xl bg-slate-800 border border-slate-600"
  >

  <div class="flex gap-3 mb-8">
    <button
      class="folder-tab tab-active px-6 py-3 rounded-xl"
      data-folder="school">
      School (5)
    </button>

    <button
      class="folder-tab px-6 py-3 rounded-xl bg-slate-800"
      data-folder="tolga">
      Tolga Oruch (3)
    </button>
  </div>

  <p id="resultCount" class="text-gray-400 mb-5"></p>

  <section
    id="gallery"
    class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
  </section>

  <p id="emptyState" class="hidden text-center p-10 text-gray-400">
    Geen foto's gevonden.
  </p>

</main>

<!-- LIGHTBOX -->

<div
  id="lightbox"
  class="hidden fixed inset-0 z-50 flex items-center justify-center p-5">

  <button
    id="closeLightbox"
    class="absolute top-5 right-6 text-4xl">
    ×
  </button>

  <button
    id="prevPhoto"
    class="absolute left-5 text-4xl">
    ‹
  </button>

  <div class="text-center max-w-5xl w-full">

    <img
      id="lightboxImage"
      class="max-h-[75vh] max-w-full mx-auto rounded-xl object-contain"
      alt="">

    <h3 id="lightboxTitle" class="text-xl font-bold mt-5"></h3>

    <p id="lightboxId" class="text-gray-400 mt-2"></p>

    <a
      id="downloadButton"
      download
      class="inline-block bg-indigo-500 hover:bg-indigo-400 px-6 py-3 rounded-xl mt-5">
      Download foto ↓
    </a>

  </div>

  <button
    id="nextPhoto"
    class="absolute right-5 text-4xl">
    ›
  </button>

</div>

<script>

// FOTOĞRAFLAR VE ID SİSTEMİ

const photos = [

  {
    id: "school_1",
    folder: "school",
    title: "1 Wit",
    src: "1 Wit.jpeg"
  },

  {
    id: "school_2",
    folder: "school",
    title: "2 Spetter",
    src: "2 Spetter.jpg"
  },

  {
    id: "school_3",
    folder: "school",
    title: "3 Zandsteen",
    src: "3 Zandsteen.jpg"
  },

  {
    id: "school_4",
    folder: "school",
    title: "4 Zwart-wit",
    src: "4 Zwart-wit.jpg"
  },

  {
    id: "school_5",
    folder: "school",
    title: "5 Urban Blue",
    src: "5 Urban Blue.jpg"
  },

  {
    id: "tolga_1",
    folder: "tolga",
    title: "Tolga Oruch 1",
    src: "1.jpg"
  },

  {
    id: "tolga_2",
    folder: "tolga",
    title: "Tolga Oruch 2",
    src: "2.jpg"
  },

  {
    id: "tolga_3",
    folder: "tolga",
    title: "Tolga Oruch 3",
    src: "3.jpeg"
  }

];

let activeFolder = "school";
let visiblePhotos = [];
let currentIndex = 0;

const gallery = document.getElementById("gallery");
const searchInput = document.getElementById("searchInput");
const lightbox = document.getElementById("lightbox");

// GALERİ

function renderGallery() {

  const query = searchInput.value.toLowerCase().trim();

  visiblePhotos = photos.filter(photo =>
    photo.folder === activeFolder &&
    (
      photo.id.toLowerCase().includes(query) ||
      photo.title.toLowerCase().includes(query) ||
      photo.src.toLowerCase().includes(query)
    )
  );

  gallery.innerHTML = visiblePhotos.map(photo => `

    <article class="photo-card">

      <button
        class="w-full text-left"
        data-open-id="${photo.id}">

        <div class="photo-thumb">

          <img
            src="${photo.src}"
            alt="${photo.title}"
            onerror="this.alt='Foto niet beschikbaar';">

        </div>

        <div class="p-4">

          <h3 class="font-bold">
            ${photo.title}
          </h3>

          <p class="text-sm text-gray-400 mt-2">
            ${photo.id}
          </p>

        </div>

      </button>

    </article>

  `).join("");

  document.getElementById("emptyState")
    .classList.toggle("hidden", visiblePhotos.length !== 0);

  gallery.classList.toggle("hidden", visiblePhotos.length === 0);

  document.getElementById("resultCount").textContent =
    visiblePhotos.length + " foto's";

}

// KLASÖR DEĞİŞTİRME

document.querySelectorAll(".folder-tab").forEach(button => {

  button.addEventListener("click", () => {

    activeFolder = button.dataset.folder;

    document.querySelectorAll(".folder-tab").forEach(tab => {
      tab.classList.remove("tab-active");
      tab.classList.add("bg-slate-800");
    });

    button.classList.add("tab-active");
    button.classList.remove("bg-slate-800");

    searchInput.value = "";

    renderGallery();

  });

});

// ARAMA

searchInput.addEventListener("input", renderGallery);

// FOTOĞRAF AÇMA

gallery.addEventListener("click", event => {

  const button = event.target.closest("[data-open-id]");

  if (!button) return;

  openLightbox(button.dataset.openId);

});

function openLightbox(id) {

  const index = visiblePhotos.findIndex(photo => photo.id === id);

  if (index === -1) return;

  currentIndex = index;

  updateLightbox();

  lightbox.classList.remove("hidden");

  document.body.style.overflow = "hidden";

}

// LIGHTBOX GÜNCELLEME

function updateLightbox() {

  const photo = visiblePhotos[currentIndex];

  document.getElementById("lightboxImage").src = photo.src;

  document.getElementById("lightboxTitle").textContent =
    photo.title;

  document.getElementById("lightboxId").textContent =
    photo.id;

  const download = document.getElementById("downloadButton");

  download.href = photo.src;
  download.download = photo.src;

}

// SAĞ VE SOL GEÇİŞ

function movePhoto(direction) {

  if (!visiblePhotos.length) return;

  currentIndex =
    (currentIndex + direction + visiblePhotos.length)
    % visiblePhotos.length;

  updateLightbox();

}

document.getElementById("prevPhoto").onclick = () => {
  movePhoto(-1);
};

document.getElementById("nextPhoto").onclick = () => {
  movePhoto(1);
};

// KAPATMA

function closeLightbox() {

  lightbox.classList.add("hidden");

  document.body.style.overflow = "";

}

document.getElementById("closeLightbox").onclick =
  closeLightbox;

lightbox.addEventListener("click", event => {

  if (event.target === lightbox) {
    closeLightbox();
  }

});

// KLAVYE KONTROLLERİ

document.addEventListener("keydown", event => {

  if (lightbox.classList.contains("hidden")) return;

  if (event.key === "Escape") closeLightbox();

  if (event.key === "ArrowLeft") movePhoto(-1);

  if (event.key === "ArrowRight") movePhoto(1);

});

// BAŞLAT

renderGallery();

</script>

</body>
</html>
